name: Check for new Redmine releases

on:
  workflow_dispatch:
  schedule:
    # Run this Action every day a 5:37am UTC
    - cron: "37 5 * * *"

jobs:
  redmine-release:
    name: Check for Redmine updates
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Check for updates
        uses: git-for-windows/rss-to-issues@99d302b353c4751ca1bda6130fb24934ec12e01e # v0.0.13
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          feed: https://www.redmine.org/projects/redmine/news.atom
          prefix: "Update the Behat tests: "
          #character-limit: 255
          dry-run: false
          max-age: 72h
          labels: "enhancement"
