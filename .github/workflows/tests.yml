name: CI

on:
  push:
    branches: [v2.x]
  pull_request:

jobs:
  tests:
    name: Tests (PHPUnit with PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: ["ubuntu-latest"]
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5", "8.6"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          coverage: xdebug

      # Install composer dependencies and handle caching in one go.
      # @link https://github.com/marketplace/actions/install-composer-dependencies
      - name: "Install Composer dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0

      - name: Run tests
        run: composer run phpunit -- --no-coverage

  behat:
    name: Behat ${{ matrix.suite }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3"]
        suite: [redmine_7_0, redmine_6_1, redmine_6_0, redmine_5_1]
        include:
          - suite: redmine_7_0
            service: redmine-7-0
            port: 5070
            data-dir: redmine-70000_data
          - suite: redmine_6_1
            service: redmine-6-1
            port: 5061
            data-dir: redmine-60103_data
          - suite: redmine_6_0
            service: redmine-6-0
            port: 5060
            data-dir: redmine-60010_data
          - suite: redmine_5_1
            service: redmine-5-1
            port: 5051
            data-dir: redmine-50112_data

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, curl
          coverage: xdebug

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Create data directory
        run: |
          mkdir -p .docker/${{ matrix.data-dir }}/{files,sqlite}
          chmod -R 777 .docker/${{ matrix.data-dir }}/

      - name: Start Redmine container
        run: docker compose up -d ${{ matrix.service }}

      - name: Wait for Redmine to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:${{ matrix.port }} > /dev/null 2>&1; then
              echo "Redmine ${{ matrix.service }} is ready"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done
          echo "Redmine ${{ matrix.service }} did not become ready"
          docker compose logs ${{ matrix.service }}
          exit 1

      - name: Fix permissions
        run: sudo chmod -R 777 .docker/${{ matrix.data-dir }}/

      - name: Run behat
        run: vendor/bin/behat --config tests/Behat/behat.yml --profile=github-actions --format=progress --suite=${{ matrix.suite }}

      - name: Cleanup
        if: always()
        run: docker compose down -v

  pest:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          coverage: xdebug

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Install Pest
        run: |
          composer config allow-plugins.pestphp/pest-plugin true
          composer require --dev pestphp/pest:^5.0 --no-interaction

      - name: Run Pest
        run: composer run pest -- --no-coverage

  code-quality:
    name: Check ${{ matrix.tool }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        operating-system: ["ubuntu-latest"]
        php: ["7.4"]
        tool: ["phpstan", "code-coverage", "code-style"]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          coverage: xdebug

      # Install composer dependencies and handle caching in one go.
      # @link https://github.com/marketplace/actions/install-composer-dependencies
      - name: "Install Composer dependencies"
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0

      - name: Run static code analysis
        if: ${{ matrix.tool == 'phpstan' }}
        run: composer run phpstan -- --error-format=github

      - name: Run tests with coverage-clover
        if: ${{ matrix.tool == 'code-coverage' }}
        run: vendor/bin/phpunit -c tests/phpunit-coverage.dist.xml --coverage-clover .phpunit.cache/clover.xml

      - name: Upload coverage reports to Codecov
        if: ${{ matrix.tool == 'code-coverage' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./.phpunit.cache/clover.xml
          fail_ci_if_error: true
          verbose: true

      - name: Check code-style
        if: ${{ matrix.tool == 'code-style' }}
        run: composer run codestyle -- --dry-run --diff
